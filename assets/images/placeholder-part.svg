<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#2a2a32" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="#141418"/>
  <rect width="400" height="300" fill="url(#grid)" />
  
  <!-- Outer border -->
  <rect x="8" y="8" width="384" height="284" fill="none" stroke="#383842" stroke-width="2"/>
  
  <!-- Blueprint Part Graphic (Mechanical Gear & Piston) -->
  <g transform="translate(200, 140)">
    <!-- Cog / Gear outline -->
    <circle cx="0" cy="0" r="60" fill="none" stroke="#E8A317" stroke-width="3" stroke-dasharray="10 4"/>
    <circle cx="0" cy="0" r="45" fill="#1a1a20" stroke="#E8A317" stroke-width="2"/>
    <circle cx="0" cy="0" r="20" fill="#141418" stroke="#F3ECD8" stroke-width="2"/>
    
    <!-- Crossed wrenches / measurement lines -->
    <line x1="-75" y1="0" x2="75" y2="0" stroke="#2A9D8F" stroke-width="1.5" stroke-dasharray="4 2"/>
    <line x1="0" y1="-75" x2="0" y2="75" stroke="#2A9D8F" stroke-width="1.5" stroke-dasharray="4 2"/>
  </g>
  
  <!-- Technical Labels -->
  <text x="20" y="32" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#E8A317" font-weight="bold">SPEC NO: AUTO-PRT-00</text>
  <text x="380" y="32" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#888" text-anchor="end">WORKSHOP MANUAL 1988</text>
  <text x="200" y="245" font-family="'IBM Plex Mono', monospace" font-size="13" fill="#F3ECD8" text-anchor="middle" font-weight="bold">GENUINE WORKSHOP COMPONENT</text>
  <text x="200" y="265" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#888" text-anchor="middle">IMAGE PENDING WORKSHOP DIGITIZATION</text>
</svg>
