<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <style>
      .bg-plate { fill: #161618; stroke: #000; stroke-width: 3; }
      .brand-txt { font-family: 'Teko', 'Oswald', sans-serif; font-size: 42px; font-weight: 700; fill: #F3ECD8; letter-spacing: 2px; }
      .brand-sub { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; fill: #E8A317; letter-spacing: 3px; }
      .accent-red { fill: #D93829; }
      .accent-amber { fill: #E8A317; }
      .accent-teal { fill: #2A9D8F; }
    </style>
  </defs>
  
  <!-- Outer border badge with retro shadow -->
  <rect x="4" y="4" width="310" height="70" rx="4" fill="#000" />
  <rect x="0" y="0" width="310" height="70" rx="4" class="bg-plate" />
  
  <!-- Tricolor racing flag badge -->
  <g transform="translate(14, 15)">
    <polygon points="0,0 12,0 8,40 0,40" fill="#D93829" />
    <polygon points="12,0 24,0 20,40 8,40" fill="#E8A317" />
    <polygon points="24,0 36,0 32,40 20,40" fill="#2A9D8F" />
    <!-- Tachometer dial / gear mini icon -->
    <circle cx="16" cy="20" r="14" fill="#0E0E10" stroke="#F3ECD8" stroke-width="2"/>
    <path d="M 8 20 A 8 8 0 0 1 24 20" stroke="#E8A317" stroke-width="2" fill="none"/>
    <line x1="16" y1="20" x2="22" y2="15" stroke="#D93829" stroke-width="2" stroke-linecap="round"/>
    <circle cx="16" cy="20" r="2.5" fill="#F3ECD8"/>
  </g>

  <!-- Typography -->
  <text x="64" y="42" class="brand-txt">SPEEDWELL</text>
  <text x="65" y="58" class="brand-sub">CLASSIC WORKS • EST. 1988</text>
  
  <!-- Right edge checkered flag detail -->
  <g transform="translate(275, 12)">
    <rect x="0" y="0" width="7" height="7" fill="#F3ECD8"/>
    <rect x="7" y="0" width="7" height="7" fill="#222"/>
    <rect x="14" y="0" width="7" height="7" fill="#F3ECD8"/>
    <rect x="0" y="7" width="7" height="7" fill="#222"/>
    <rect x="7" y="7" width="7" height="7" fill="#F3ECD8"/>
    <rect x="14" y="7" width="7" height="7" fill="#222"/>
    <rect x="0" y="14" width="7" height="7" fill="#F3ECD8"/>
    <rect x="7" y="14" width="7" height="7" fill="#222"/>
    <rect x="14" y="14" width="7" height="7" fill="#F3ECD8"/>
    <rect x="0" y="21" width="7" height="7" fill="#222"/>
    <rect x="7" y="21" width="7" height="7" fill="#F3ECD8"/>
    <rect x="14" y="21" width="7" height="7" fill="#222"/>
    <rect x="0" y="28" width="7" height="7" fill="#F3ECD8"/>
    <rect x="7" y="28" width="7" height="7" fill="#222"/>
    <rect x="14" y="28" width="7" height="7" fill="#F3ECD8"/>
    <rect x="0" y="35" width="7" height="7" fill="#222"/>
    <rect x="7" y="35" width="7" height="7" fill="#F3ECD8"/>
    <rect x="14" y="35" width="7" height="7" fill="#222"/>
  </g>
</svg>
