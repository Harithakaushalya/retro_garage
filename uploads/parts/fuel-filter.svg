<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <defs>
    <pattern id="grid-part" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#222228" stroke-width="0.7"/>
    </pattern>
  </defs>
  <rect width="400" height="280" fill="#121215"/>
  <rect width="400" height="280" fill="url(#grid-part)"/>
  <rect x="6" y="6" width="388" height="268" fill="none" stroke="#2a2a32" stroke-width="1.5"/>
  <rect x="10" y="10" width="380" height="260" fill="none" stroke="#1c1c22" stroke-width="1"/>
  
  <text x="18" y="28" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#2A9D8F" font-weight="bold">SKU: NIS-FF-105</text>
  <text x="382" y="28" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#777" text-anchor="end">SPEEDWELL SPEC</text>
  
  <!-- Artwork -->
  <g>
            <!-- Inlet pipe -->
            <rect x="120" y="136" width="35" height="8" fill="#888" stroke="#F3ECD8" stroke-width="1.5"/>
            <!-- Filter canister body -->
            <rect x="155" y="105" width="90" height="70" rx="8" fill="#1f3b37" stroke="#2A9D8F" stroke-width="3"/>
            <path d="M 180 105 L 180 175" stroke="#2A9D8F" stroke-width="1.5" stroke-dasharray="4 2"/>
            <path d="M 220 105 L 220 175" stroke="#2A9D8F" stroke-width="1.5" stroke-dasharray="4 2"/>
            <text x="200" y="145" font-family="monospace" font-size="10" fill="#F3ECD8" text-anchor="middle" font-weight="bold">FLOW →</text>
            <!-- Outlet pipe -->
            <rect x="245" y="136" width="35" height="8" fill="#888" stroke="#F3ECD8" stroke-width="1.5"/>
        </g>
  
  <!-- Labels -->
  <text x="200" y="240" font-family="'Oswald', sans-serif" font-size="14" fill="#F3ECD8" text-anchor="middle" font-weight="bold" letter-spacing="1">METALLIC FUEL FILTER</text>
  <text x="200" y="258" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#8a8a93" text-anchor="middle">10-MICRON IN-LINE HIGH PRESSURE</text>
</svg>