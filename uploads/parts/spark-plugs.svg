<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <defs>
    <pattern id="grid-part" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#222228" stroke-width="0.7"/>
    </pattern>
  </defs>
  <rect width="400" height="280" fill="#121215"/>
  <rect width="400" height="280" fill="url(#grid-part)"/>
  <rect x="6" y="6" width="388" height="268" fill="none" stroke="#2a2a32" stroke-width="1.5"/>
  <rect x="10" y="10" width="380" height="260" fill="none" stroke="#1c1c22" stroke-width="1"/>
  
  <text x="18" y="28" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#E8A317" font-weight="bold">SKU: TOY-SP-771</text>
  <text x="382" y="28" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#777" text-anchor="end">SPEEDWELL SPEC</text>
  
  <!-- Artwork -->
  <g>
            <!-- Terminal -->
            <rect x="194" y="65" width="12" height="15" rx="3" fill="#silver" stroke="#F3ECD8" stroke-width="1.5"/>
            <!-- Ceramic insulator with ribs -->
            <rect x="190" y="80" width="20" height="45" fill="#FAF6EB" stroke="#888" stroke-width="1.5"/>
            <line x1="188" y1="90" x2="212" y2="90" stroke="#aaa" stroke-width="2"/>
            <line x1="188" y1="100" x2="212" y2="100" stroke="#aaa" stroke-width="2"/>
            <line x1="188" y1="110" x2="212" y2="110" stroke="#aaa" stroke-width="2"/>
            <text x="200" y="102" font-family="monospace" font-size="7" fill="#D93829" text-anchor="middle" font-weight="bold">DENSO</text>
            <!-- Hex nut body -->
            <polygon points="186,125 214,125 218,145 182,145" fill="#E8A317" stroke="#000" stroke-width="1.5"/>
            <!-- Threaded metal shell -->
            <rect x="188" y="145" width="24" height="40" fill="#444" stroke="#222" stroke-width="1"/>
            <line x1="188" y1="152" x2="212" y2="152" stroke="#E8A317" stroke-width="1.5"/>
            <line x1="188" y1="160" x2="212" y2="160" stroke="#E8A317" stroke-width="1.5"/>
            <line x1="188" y1="168" x2="212" y2="168" stroke="#E8A317" stroke-width="1.5"/>
            <line x1="188" y1="176" x2="212" y2="176" stroke="#E8A317" stroke-width="1.5"/>
            <!-- Ground & Central electrode -->
            <line x1="200" y1="185" x2="200" y2="205" stroke="#3a86ff" stroke-width="2"/>
            <path d="M 194 210 L 200 210 L 200 206" fill="none" stroke="#F3ECD8" stroke-width="2"/>
        </g>
  
  <!-- Labels -->
  <text x="200" y="240" font-family="'Oswald', sans-serif" font-size="14" fill="#F3ECD8" text-anchor="middle" font-weight="bold" letter-spacing="1">DENSO IRIDIUM PLUGS</text>
  <text x="200" y="258" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#8a8a93" text-anchor="middle">0.4MM ULTRA-FINE ELECTRODE</text>
</svg>