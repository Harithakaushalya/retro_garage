<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <defs>
    <pattern id="grid-part" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#222228" stroke-width="0.7"/>
    </pattern>
  </defs>
  <rect width="400" height="280" fill="#121215"/>
  <rect width="400" height="280" fill="url(#grid-part)"/>
  <rect x="6" y="6" width="388" height="268" fill="none" stroke="#2a2a32" stroke-width="1.5"/>
  <rect x="10" y="10" width="380" height="260" fill="none" stroke="#1c1c22" stroke-width="1"/>
  
  <text x="18" y="28" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#2A9D8F" font-weight="bold">SKU: YMH-FO-204</text>
  <text x="382" y="28" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#777" text-anchor="end">SPEEDWELL SPEC</text>
  
  <!-- Artwork -->
  <g>
            <!-- Fork Tube (Gold anodized stanchion) -->
            <rect x="180" y="60" width="40" height="90" fill="#e0a92d" stroke="#b08018" stroke-width="2"/>
            <line x1="190" y1="60" x2="190" y2="150" stroke="#fff" stroke-width="1.5" opacity="0.6"/>
            <!-- Lower fork slider -->
            <rect x="170" y="150" width="60" height="65" rx="4" fill="#242b35" stroke="#2A9D8F" stroke-width="3"/>
            <!-- Oil and dust seal rings -->
            <rect x="174" y="146" width="52" height="8" rx="2" fill="#D93829" stroke="#000" stroke-width="1"/>
            <text x="200" y="190" font-family="monospace" font-size="9" fill="#2A9D8F" text-anchor="middle" font-weight="bold">SEAL KIT</text>
        </g>
  
  <!-- Labels -->
  <text x="200" y="240" font-family="'Oswald', sans-serif" font-size="14" fill="#F3ECD8" text-anchor="middle" font-weight="bold" letter-spacing="1">FORK OIL & DUST SEAL SET</text>
  <text x="200" y="258" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#8a8a93" text-anchor="middle">DUAL LIP HIGH VISCOSITY SUSPENSION SEALS</text>
</svg>