<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <defs>
    <pattern id="grid-part" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#222228" stroke-width="0.7"/>
    </pattern>
  </defs>
  <rect width="400" height="280" fill="#121215"/>
  <rect width="400" height="280" fill="url(#grid-part)"/>
  <rect x="6" y="6" width="388" height="268" fill="none" stroke="#2a2a32" stroke-width="1.5"/>
  <rect x="10" y="10" width="380" height="260" fill="none" stroke="#1c1c22" stroke-width="1"/>
  
  <text x="18" y="28" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#3a86ff" font-weight="bold">SKU: NIS-WP-884</text>
  <text x="382" y="28" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#777" text-anchor="end">SPEEDWELL SPEC</text>
  
  <!-- Artwork -->
  <g>
            <!-- Pulley flange -->
            <circle cx="170" cy="140" r="38" fill="#222" stroke="#3a86ff" stroke-width="3"/>
            <circle cx="170" cy="140" r="14" fill="#161618" stroke="#F3ECD8" stroke-width="2"/>
            <!-- Impeller housing & outlet spout -->
            <path d="M 195 125 C 230 110, 260 130, 255 165 L 235 160 C 220 175, 185 170, 175 160 Z" fill="#1b2a38" stroke="#F3ECD8" stroke-width="2"/>
            <!-- Impeller vanes -->
            <line x1="225" y1="135" x2="245" y2="145" stroke="#E8A317" stroke-width="2.5"/>
            <line x1="230" y1="150" x2="245" y2="135" stroke="#E8A317" stroke-width="2.5"/>
        </g>
  
  <!-- Labels -->
  <text x="200" y="240" font-family="'Oswald', sans-serif" font-size="14" fill="#F3ECD8" text-anchor="middle" font-weight="bold" letter-spacing="1">CAST WATER PUMP</text>
  <text x="200" y="258" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#8a8a93" text-anchor="middle">PRECISION MACHINED ALUMINUM HOUSING</text>
</svg>